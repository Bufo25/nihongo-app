name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тесты логики
        run: npm test
      - name: Сборка
        run: npm run build
        env:
          # Settings → Secrets and variables → Actions → Variables: GOOGLE_CLIENT_ID (не секрет)
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - name: Словарь JMdict (русский + английский для частых слов)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .dict
          gh release download -R scriptin/jmdict-simplified -D .dict \
            --pattern 'jmdict-rus-[0-9]*.json.tgz' --pattern 'jmdict-eng-common-[0-9]*.json.tgz'
          for f in .dict/*.tgz; do tar xzf "$f" -C .dict; done
          ls -la .dict
          node --max-old-space-size=4096 scripts/build-dict.mjs \
            --rus "$(ls .dict/jmdict-rus-*.json | head -1)" \
            --eng "$(ls .dict/jmdict-eng-common-*.json | head -1)" \
            --out dist/dict
      - name: Браузер для тестов
        run: npx playwright install --with-deps chromium
      - name: Браузерные тесты
        run: npm run test:e2e
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
